name: Stock profiles

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["zoh/profile.py", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AMD and META personality profiles
        run: python -m zoh.profile AMD META
      - name: Commit results
        run: |
          git config user.name "zoh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/research/PROFILE_*.md
          git diff --cached --quiet && exit 0
          git commit -m "research: stock profiles $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
