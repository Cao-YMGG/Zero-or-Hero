name: Underlying comparison

# Same variants, different underlyings: is 0DTE on high-volatility single stocks better than SPY?
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/underlyings.yml"]

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backtest each underlying
        run: |
          for sym in AMD NVDA TSLA META MU; do
            python -m zoh.backtest --underlying $sym --iv auto --slippage 0.03 --mwf \
              --out journal/research/underlyings/$sym.md
          done
      - name: Commit results
        run: |
          git config user.name "zoh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/research/underlyings
          git diff --cached --quiet && exit 0
          git commit -m "research: underlying comparison $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
