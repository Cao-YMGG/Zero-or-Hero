name: Diagnostics & backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Calendar days of history to backtest"
        default: "365"
  push:
    branches: ["claude/**"]
    paths: ["zoh/**", "config/**", "tests/**", ".github/workflows/diagnostics.yml"]

permissions:
  contents: write

concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest -v
      - name: Account, chain and signal check
        run: python -m zoh.check
      - name: Backtest
        run: python -m zoh.backtest --days "${{ inputs.days || '365' }}" --out journal/BACKTEST.md
      - name: Commit backtest report
        run: |
          git config user.name "zoh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/BACKTEST.md
          git diff --cached --quiet && exit 0
          git commit -m "backtest: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
