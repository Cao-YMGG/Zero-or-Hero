name: Research - follow the open

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["zoh/research/opendrive.py", ".github/workflows/opendrive.yml"]

permissions:
  contents: write

concurrency:
  group: opendrive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opendrive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Follow-the-open study
        run: python -m zoh.research.opendrive
      - name: Commit results
        run: |
          git config user.name "zoh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/research
          git diff --cached --quiet && exit 0
          git commit -m "research: follow-the-open study $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
