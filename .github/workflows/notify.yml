name: Notify
# Posts the pre-market call and each intraday pick to Discord when Claude pushes them.
# Without the DISCORD_WEBHOOK_URL secret every post is skipped.
on:
  push:
    branches: [main]
    paths:
      - "journal/bias/*.json"
      - "journal/bias/intraday/*.json"
      - "journal/opportunities/*.json"
  workflow_dispatch:
    inputs:
      mode:
        description: "changed = post the files the last push changed; test = one test message per configured channel"
        default: test
        type: choice
        options: [test, changed]

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post what changed (or a test message per channel)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_PREMARKET: ${{ secrets.DISCORD_WEBHOOK_PREMARKET }}
          DISCORD_WEBHOOK_INTRADAY: ${{ secrets.DISCORD_WEBHOOK_INTRADAY }}
          DISCORD_WEBHOOK_TRADES: ${{ secrets.DISCORD_WEBHOOK_TRADES }}
          DISCORD_WEBHOOK_REVIEW: ${{ secrets.DISCORD_WEBHOOK_REVIEW }}
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          DISCORD_WEBHOOK_RESEARCH: ${{ secrets.DISCORD_WEBHOOK_RESEARCH }}
          DISCORD_WEBHOOK_OPPORTUNITIES: ${{ secrets.DISCORD_WEBHOOK_OPPORTUNITIES }}
          BEFORE: ${{ github.event.before }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "test" ]; then python -m zoh.notify test; exit 0; fi
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then BEFORE=HEAD~1; fi
          for f in $(git diff --name-only "$BEFORE" HEAD -- journal/bias journal/opportunities); do
            [ -f "$f" ] || continue
            case "$f" in
              journal/bias/intraday/*.json) python -m zoh.notify intraday --file "$f" ;;
              journal/bias/README.md) ;;
              journal/bias/*.json) python -m zoh.notify bias --file "$f" ;;
              journal/opportunities/*.json) python -m zoh.notify opportunities --file "$f" ;;
            esac
          done
