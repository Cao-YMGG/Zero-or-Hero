name: Dashboard

# Rebuilds the GitHub Pages dashboard from the journal. Journal commits made by other
# workflows use GITHUB_TOKEN and do not trigger push events, hence workflow_run.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Trade", "Diagnostics & backtest"]
    types: [completed]
  schedule:
    - cron: "50 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m zoh.site --out site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
