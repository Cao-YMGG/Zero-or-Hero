name: Stock screen

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Calendar days of history"
        default: "730"
      groups:
        description: 'JSON list of "MWF:SYM SYM" / "FRI:SYM" groups (default: all)'
        default: ""
  push:
    branches: ["claude/**"]
    paths: ["zoh/screen_report.py", ".github/workflows/screen.yml"]

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2  # one data API key: avoid rate limits
      matrix:
        group: ${{ fromJSON(inputs.groups || '["MWF:AAPL AMZN MSFT META NVDA", "MWF:TSLA GOOGL AVGO AMD MU", "FRI:NFLX PLTR COIN MSTR SMCI", "FRI:ARM INTC ORCL HOOD APP", "FRI:RKLB IONQ CRDO LITE SNDK"]') }}
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      DAYS: ${{ inputs.days || '730' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backtest group
        run: |
          kind="${{ matrix.group }}"; kind="${kind%%:*}"
          syms="${{ matrix.group }}"; syms="${syms#*:}"
          flag=$([ "$kind" = MWF ] && echo --mwf || echo --fri)
          for sym in $syms; do
            python -m zoh.backtest --underlying $sym --iv auto --slippage 0.03 $flag \
              --days $DAYS --variants config/research_screen.json \
              --json-out journal/research/screen/$sym.json || echo "failed $sym"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screen-${{ strategy.job-index }}
          path: journal/research/screen/

  report:
    needs: backtest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: screen-*
          path: journal/research/screen/
          merge-multiple: true
      - run: python -m zoh.screen_report
      - name: Commit results
        run: |
          git config user.name "zoh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/research/screen journal/research/SCREEN.md
          git diff --cached --quiet && exit 0
          git commit -m "research: stock screen $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
