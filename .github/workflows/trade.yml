name: Trade

# Scheduled workflows only run from the default branch. Two crons cover both EDT and EST
# (08:45 ET either way, leaving slack for GitHub's cron delays before the open); the bot
# exits immediately when started before 08:30 ET, and the concurrency group queues the
# second run behind the first, which then sees the day is done.
on:
  schedule:
    - cron: "45 12 * * 1-5"
    - cron: "45 13 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Shadow trades only (no real paper orders)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write  # the bot asks for a dashboard rebuild every 30 minutes

concurrency:
  group: trade
  cancel-in-progress: false

env:
  APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
  APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
  GH_TOKEN: ${{ github.token }}
  DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trade until 12:45 ET
        run: python -m zoh.bot --until 12:45 --publish $DRY_RUN_FLAG
      - name: Commit journal
        if: always()
        run: .github/commit-journal.sh "morning"

  # Runs even if the morning leg failed so open positions are always managed and closed.
  afternoon:
    needs: morning
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trade to exit time and close out
        run: python -m zoh.bot --publish $DRY_RUN_FLAG
      - name: Review and promote
        if: always()
        run: python -m zoh.review
      - name: Commit journal
        if: always()
        run: .github/commit-journal.sh "afternoon"
